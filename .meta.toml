# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.8.1.dev0"

[tox]
test_matrix = {"6.2" = ["*"]}

[pyproject]
dependencies_mappings = [
    "'Products.ZCatalog' = ['Products.ZCTextIndex', 'Products.PluginIndexes']",
    ]
# plone.distribution is only conditionally used.
# plone.app.contentrules and plone.contentrules are core add-ons since Plone 6.3,
# the upgrade code and its tests work without them.
dependencies_ignores = "['plone.distribution', 'plone.app.contentrules', 'plone.contentrules']"
